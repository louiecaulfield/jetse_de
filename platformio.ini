; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[monitor]
speed = 115200

[common]
build_flags =  -Wl,-u,vfprintf -lprintf_flt -lm
	-D BAUD=${monitor.speed}
	-D N_CHANNELS=24
	-D N_RECEIVERS=4

[transmitter]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = ${monitor.speed}
lib_deps =
	nrf24/RF24 @ 1.4.8
	electroniccats/MPU6050 @ 1.3.1
	nicohood/PinChangeInterrupt @ 1.2.9
build_src_filter = +<*> -<receiver.cpp> -<.git/> -<.svn/>
build_flags = ${common.build_flags}
	; -D SERIAL_DEBUG_TRACKER

[env:transmitter-v2]
extends = transmitter
upload_port = /dev/serial/by-path/pci-0000:03:00.0-usbv2-0:1.4.1.2:1.0-port0
monitor_port = ${this.upload_port}
build_flags = ${transmitter.build_flags}
	-D RADIO_CE_CS=10,9

[env:transmitter-v3]
extends = transmitter
upload_port = /dev/serial/by-path/pci-0000:03:00.0-usbv2-0:1.4.1.4.2:1.0-port0
monitor_port = ${this.upload_port}
build_flags = ${transmitter.build_flags}
	-D RADIO_CE_CS=7,8

[receiver]
framework = arduino
platform = atmelavr
lib_deps =
	nrf24/RF24 @ 1.4.8
	bakercp/PacketSerial @ 1.4.0
build_src_filter = +<*> -<transmitter.cpp> -<.git/> -<.svn/>
build_flags = ${common.build_flags}
	; -D SERIAL_DEBUG_TRACKER
monitor_speed = ${monitor.speed}

[receiver-rfnano-v1]
extends = receiver
board = nanoatmega328
build_flags = ${receiver.build_flags}
	-D RADIOS_CE_CS=10,9

[env:receiver-rfnano-v1-rx0]
extends = receiver-rfnano-v1
upload_port = /dev/serial/by-path/pci-0000:03:00.0-usbv2-0:1.4.1.3:1.0-port0
monitor_port = ${this.upload_port}
build_flags = ${receiver-rfnano-v1.build_flags}
	-D RECEIVER_OFFSET=0

[env:receiver-rfnano-v1-rx1]
extends = receiver-rfnano-v1
upload_port = /dev/serial/by-path/pci-0000:03:00.0-usbv2-0:1.4.1.4.4.3:1.0-port0
monitor_port = ${this.upload_port}
build_flags = ${receiver-rfnano-v1.build_flags}
	-D RECEIVER_OFFSET=1

[env:receiver-rfnano-v3]
extends = receiver
board = nanoatmega328new
upload_port = /dev/serial/by-path/pci-0000:03:00.0-usbv2-0:1.4.1.4.2:1.0-port0
monitor_port = ${this.upload_port}
build_flags = ${receiver.build_flags}
	-D RECEIVER_OFFSET=0
	-D RADIOS_CE_CS=7,8

[env:receiver-uno-3ch]
extends = receiver
board = uno
upload_port = /dev/serial/by-path/pci-0000:00:14.0-usb-0:8.1:1.0-port0
monitor_port = ${this.upload_port}
build_flags = ${receiver.build_flags}
	-D RECEIVER_OFFSET=1
	-D RADIOS_CE_CS=4,5,6,7,8,9

[env:receiver-uno-1ch]
extends = receiver
board = uno
upload_port = /dev/serial/by-path/pci-0000:03:00.0-usbv2-0:1.4.1.4.4.4:1.0-port0
monitor_port = ${this.upload_port}
build_flags = ${receiver.build_flags}
	-D RECEIVER_OFFSET=0
	-D RADIOS_CE_CS=10,9
